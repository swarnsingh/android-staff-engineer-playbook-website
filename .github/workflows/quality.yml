name: Docs quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality-gate dependencies
        run: python3 -m pip install --requirement requirements-quality.txt
      - name: Test quality-gate behavior
        run: python3 -m unittest discover --start-directory scripts --pattern "test_*.py"
      - name: Run quality gates (links, anchors, guided indexes, content)
        run: python3 scripts/check_docs.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render and validate repository visuals
        run: python3 scripts/check_visuals.py --renderer "npx --yes @mermaid-js/mermaid-cli@11.16.0 --puppeteerConfigFile .github/puppeteer-config.json"

  check-external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check external links
        run: python3 scripts/check_external_links.py
