name: Docs quality gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run quality gates (links, redirects, TODOs, thin files)
        run: python3 scripts/check_docs.py
