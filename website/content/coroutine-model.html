<figure class="model" id="model-figure"><div class="model-header"><div><span class="eyebrow">STEP THROUGH THE MODEL</span><h3>One profile. Different outcomes.</h3></div><div class="scenario-choice"><label for="scene-select">Scenario</label><select id="scene-select"><option value="success">Both requests succeed</option><option value="cancel">Owner is cleared</option><option value="failure">Required avatar fails</option><option value="supervised">Avatar is optional (handled at await)</option></select></div></div>

<div class="model-caption"><span id="step-count">Step 1</span><span id="model-time">Before start</span><p id="model-caption" aria-live="polite">The UI owner is about to start one profile load. No request has started yet.</p></div>

<div class="model-code"><span class="code-label">Kotlin shape · highlighted line corresponds to this step</span><pre tabindex="0" aria-label="Model code with current step highlighted"><code id="model-code">coroutineScope {
    val name = async { fetchName() } // 500ms wait
    val avatar = async { fetchAvatar() } // 800ms wait
    val resolvedName = name.await()
    val resolvedAvatar = avatar.await()
    Profile(resolvedName, resolvedAvatar)
}</code></pre></div>
<details class="static-model"><summary>Read the same model as a static step table</summary><div class="table-scroll" tabindex="0"><table><caption id="step-table-caption">Illustrative inputs: name waits 500ms; avatar waits 800ms. Requests are main-safe and non-blocking.</caption><thead><tr><th>Step</th><th>Name</th><th>Avatar</th><th>Parent</th><th>What it means</th></tr></thead><tbody id="step-table"><tr><td>1. Before start</td><td>Not started</td><td>Not started</td><td>Not started</td><td>The UI owner is about to start one profile load. No request has started yet.</td></tr><tr><td>2. 0ms · after requests start</td><td>Suspended</td><td>Suspended</td><td>Waiting for results</td><td>Both requests start. Each reaches its suspending wait. Their waits no longer occupy the UI thread.</td></tr><tr><td>3. About 500ms</td><td>Complete</td><td>Suspended</td><td>Waiting for avatar</td><td>Name finishes first. The caller can obtain it, but still waits for the avatar. This is not simultaneous completion.</td></tr><tr><td>4. About 800ms</td><td>Complete</td><td>Complete</td><td>Combining results</td><td>Avatar finishes. Both await calls can now supply their values and the block constructs the profile.</td></tr><tr><td>5. After completion</td><td>Complete</td><td>Complete</td><td>Complete</td><td>The scope block and both children have completed. The caller receives the profile; no child request is left running.</td></tr></tbody></table></div></details>
