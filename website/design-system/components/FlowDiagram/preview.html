  <figure class="pb-figure" data-pb-flow="diagram">
    <h3>A blocked call</h3>
    <div class="pb-paper"><svg class="pb-svg" role="img" aria-label="The UI thread sends a call to the Binder driver. Both service threads are busy, so calls queue in the driver and no reply comes back yet."></svg></div>
    <div class="pb-bar"><p>Orange dash-dot means stuck: calls slow down and wait in the driver until a service thread frees up. The faint reply path has nothing on it yet.</p><button type="button" class="pb-btn" data-toggle aria-pressed="false">Pause</button></div>
    <script type="application/json">
    {"nodes": [{"id": "ui", "label": "UI thread"}, {"id": "driver", "label": "Binder driver", "queue": true}, {"id": "pool", "label": "Service threads", "chips": ["T1", "T2"]}],
     "state": {"nodes": {"ui": ["is-warn", "blocked · waiting"], "driver": ["is-warn", "queued: 3"], "pool": ["is-warn", ""]}, "chips": {"T1": "busy", "T2": "busy"}, "queue": 3},
     "streams": [{"edge": "c1", "tone": "fwd", "count": 2}, {"edge": "c2", "tone": "stuck", "count": 2, "period": 4.8}],
     "layouts": {

         "edges": {"c1": "M118 96 C102 116 102 138 118 158", "c2": "M118 246 C102 266 102 288 118 308", "r1": "M202 308 C218 288 218 266 202 246", "r2": "M202 158 C218 138 218 116 202 96"},
