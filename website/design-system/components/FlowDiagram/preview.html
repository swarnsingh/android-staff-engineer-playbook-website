<!-- @dsCard group="Diagrams" height=640 subtitle="Packets travel along the connectors; blocked work piles up" -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Patrick+Hand&display=swap">
<style>
  body { margin: 0; background: var(--sheet); color: var(--ink); font-family: var(--font-sans); }
  .demo { display: grid; gap: 28px; padding: 24px; }
  .flow { margin: 0; border-radius: var(--radius-md); padding: 12px 16px 14px;
    background-color: var(--sheet-sunken);
    background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.4px);
    background-size: var(--space-4) var(--space-4); }
  .flow h3 { margin: 4px 0 2px; font: 600 15px/22px var(--font-sans); color: var(--ink); }
  .flow svg { display: block; width: 100%; height: auto; }
  .node rect { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 2; }
  .node.busy rect { stroke: var(--warn); }
  .node .t { font: 19px var(--font-hand); fill: var(--ink); text-anchor: middle; }
  .node .s { font: 12px var(--font-sans); fill: var(--ink-muted); text-anchor: middle; }
  .node .s.warn { fill: var(--warn); font-weight: 600; }
  .slot { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; }
  .edge { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 7 7;
    animation: march 1.4s linear infinite; }
  .edge.fwd { stroke: var(--accent); }
  .edge.back { stroke: var(--event); }
  .edge.stuck { stroke: var(--warn); animation-duration: 2.8s; }
  .edge.ghost { stroke: var(--line-strong); stroke-dasharray: 2 7; animation: none; }
  @keyframes march { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
  .head-fwd { fill: var(--accent); } .head-back { fill: var(--event); }
  .head-stuck { fill: var(--warn); } .head-ghost { fill: var(--line-strong); }
  .pk-fwd { fill: var(--accent); } .pk-back { fill: var(--event); } .pk-stuck { fill: var(--warn); }
  .queue circle { fill: var(--warn); }
  .lbl { font: 17px var(--font-hand); text-anchor: middle; }
  .lbl.fwd { fill: var(--accent); } .lbl.back { fill: var(--event); }
  .lbl.stuck { fill: var(--warn); } .lbl.ghost { fill: var(--ink-muted); }
  .note { font: 17px var(--font-hand); fill: var(--ink-muted); text-anchor: middle; }
  .order { display: none; }
  .order circle { fill: var(--sheet); stroke: var(--line-strong); stroke-width: 1.5; }
  .order text { font: 600 11px var(--font-sans); fill: var(--ink); text-anchor: middle; }
  .is-static .order { display: inline; }
  .is-static .packets { display: none; }
  .is-static .edge, .paused .edge { animation-play-state: paused; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .bar p { margin: 0; flex: 1 1 260px; min-width: 0; font: 14px/21px var(--font-sans); color: var(--ink-muted); }
  .bar button { font: 600 13px/18px var(--font-sans); color: var(--ink); background: var(--sheet);
    border: 1.5px solid var(--line-strong); border-radius: var(--radius-pill); padding: 6px 14px; cursor: pointer; }
  .bar button:hover { border-color: var(--accent); }
  .bar button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .edge { animation: none; } }
</style>

<div class="demo">
  <figure class="flow" data-flow>
    <h3>State down, events up</h3>
    <svg viewBox="0 0 720 230" role="img" aria-labelledby="f1t">
      <title id="f1t">Products flow from the repository to the ViewModel to the Compose UI; clicks flow back from the UI to the ViewModel and on to the repository.</title>
      <defs>
        <filter id="rough1" x="-4%" y="-12%" width="108%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
        <marker id="hf1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-fwd" d="M0 1 L9 5 L0 9 z"/></marker>
        <marker id="hb1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-back" d="M0 1 L9 5 L0 9 z"/></marker>
        <path id="e1" d="M194 96 C224 70 246 70 274 96"/>
        <path id="e2" d="M446 96 C476 70 498 70 526 96"/>
        <path id="b1" d="M526 126 C496 152 474 152 446 126"/>
        <path id="b2" d="M274 126 C244 152 222 152 194 126"/>
      </defs>

      <g class="node"><rect x="24" y="78" width="168" height="66" rx="10" filter="url(#rough1)"/><text class="t" x="108" y="108">Repository</text><text class="s" x="108" y="128">emits products</text></g>
      <g class="node"><rect x="276" y="78" width="168" height="66" rx="10" filter="url(#rough1)"/><text class="t" x="360" y="108">ViewModel</text><text class="s" x="360" y="128">holds UiState</text></g>
      <g class="node"><rect x="528" y="78" width="168" height="66" rx="10" filter="url(#rough1)"/><text class="t" x="612" y="108">Compose UI</text><text class="s" x="612" y="128">renders, sends clicks</text></g>

      <use href="#e1" class="edge fwd" marker-end="url(#hf1)"/>
      <use href="#e2" class="edge fwd" marker-end="url(#hf1)"/>
      <use href="#b1" class="edge back" marker-end="url(#hb1)"/>
      <use href="#b2" class="edge back" marker-end="url(#hb1)"/>

      <text class="lbl fwd" x="234" y="60">products</text>
      <text class="lbl fwd" x="486" y="60">uiState</text>
      <text class="lbl back" x="486" y="178">onClick</text>
      <text class="lbl back" x="234" y="178">refresh()</text>

      <g class="order">
        <circle cx="180" cy="56" r="9"/><text x="180" y="60">1</text>
        <circle cx="432" cy="56" r="9"/><text x="432" y="60">2</text>
        <circle cx="540" cy="174" r="9"/><text x="540" y="178">3</text>
        <circle cx="288" cy="174" r="9"/><text x="288" y="178">4</text>
      </g>

      <g class="packets">
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#e2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
        <circle class="pk-back" r="4.5" opacity="0"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#b1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle class="pk-back" r="4.5" opacity="0"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#b2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
      </g>

      <text class="note" x="360" y="216">state flows right · events flow back</text>
    </svg>
    <div class="bar">
      <p>Green packets are state moving toward the screen; blue packets are the user's events going back.</p>
      <button type="button" data-toggle aria-pressed="false">Pause</button>

  </figure>

  <figure class="flow" data-flow>
    <h3>A blocked call</h3>
    <svg viewBox="0 0 720 230" role="img" aria-labelledby="f2t">
      <title id="f2t">The UI thread sends a call through the Binder driver to the service; both service threads are busy, so calls queue in the driver and the UI thread waits for a reply that has not come.</title>
      <defs>
        <filter id="rough2" x="-4%" y="-12%" width="108%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="2.4"/></filter>
        <marker id="hf2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-fwd" d="M0 1 L9 5 L0 9 z"/></marker>
        <marker id="hs2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-stuck" d="M0 1 L9 5 L0 9 z"/></marker>
        <marker id="hg2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ghost" d="M0 1 L9 5 L0 9 z"/></marker>
        <path id="c1" d="M194 96 C224 70 246 70 274 96"/>
        <path id="c2" d="M446 96 C470 74 486 72 500 84"/>
        <path id="r1" d="M526 128 C496 152 474 152 446 128"/>
        <path id="r2" d="M274 128 C244 152 222 152 194 128"/>
      </defs>

      <g class="node busy"><rect x="24" y="78" width="168" height="68" rx="10" filter="url(#rough2)"/><text class="t" x="108" y="106">UI thread</text><text class="s warn" x="108" y="128">waiting 2.0 s</text></g>
      <g class="node"><rect x="276" y="78" width="168" height="68" rx="10" filter="url(#rough2)"/><text class="t" x="360" y="106">Binder driver</text><text class="s" x="360" y="128">queues the call</text></g>
      <g class="node busy"><rect x="528" y="78" width="168" height="68" rx="10" filter="url(#rough2)"/><text class="t" x="612" y="104">Service threads</text>
        <rect class="slot" x="556" y="116" width="50" height="18" rx="5"/><rect class="slot" x="618" y="116" width="50" height="18" rx="5"/>
        <text class="s warn" x="581" y="130">busy</text><text class="s warn" x="643" y="130">busy</text></g>

      <use href="#c1" class="edge fwd" marker-end="url(#hf2)"/>
      <use href="#c2" class="edge stuck" marker-end="url(#hs2)"/>
      <use href="#r1" class="edge ghost" marker-end="url(#hg2)"/>
      <use href="#r2" class="edge ghost" marker-end="url(#hg2)"/>

      <g class="queue"><circle cx="508" cy="94" r="5.5"/><circle cx="514" cy="106" r="5.5"/><circle cx="510" cy="118" r="5.5"/></g>

      <text class="lbl fwd" x="234" y="60">isPlaying()</text>
      <text class="lbl stuck" x="476" y="60">no free thread</text>
      <text class="lbl ghost" x="360" y="182">reply (not yet)</text>

      <g class="order">
        <circle cx="180" cy="56" r="9"/><text x="180" y="60">1</text>
        <circle cx="420" cy="56" r="9"/><text x="420" y="60">2</text>
      </g>

      <g class="packets">
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#c1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
        <circle class="pk-fwd" r="5.5" opacity="0"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .55 1"><mpath href="#c1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle class="pk-stuck" r="5.5" opacity="0"><animateMotion dur="4.8s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".2 0 .1 1"><mpath href="#c2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="4.8s" begin="0.6s" repeatCount="indefinite"/></circle>
        <circle class="pk-stuck" r="5.5" opacity="0"><animateMotion dur="4.8s" begin="3s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".2 0 .1 1"><mpath href="#c2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.8;1" dur="4.8s" begin="3s" repeatCount="indefinite"/></circle>
      </g>

      <text class="note" x="360" y="216">the call looked local; the thread waits for a free Binder thread</text>
    </svg>
    <div class="bar">
      <p>Orange means stuck: calls slow down and pile up in the driver until a service thread frees up. The dotted reply path has nothing on it yet.</p>
      <button type="button" data-toggle aria-pressed="false">Pause</button>
    </div>
  </figure>
</div>

<script>
  (function () {
    var reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
    var flows = Array.prototype.slice.call(document.querySelectorAll('[data-flow]'));
    function apply(fig) {
      var svg = fig.querySelector('svg');
      var btn = fig.querySelector('[data-toggle]');
      var userPaused = fig.dataset.userPaused === '1';
      var hidden = fig.dataset.offscreen === '1';
      var stillByOs = reduce.matches && fig.dataset.userPlayed !== '1';
      var run = !userPaused && !hidden && !stillByOs;
      fig.classList.toggle('is-static', stillByOs || userPaused);
      fig.classList.toggle('paused', !run);
      if (svg.pauseAnimations) { run ? svg.unpauseAnimations() : svg.pauseAnimations(); }
      var showingStill = stillByOs || userPaused;
      btn.textContent = showingStill ? 'Play' : 'Pause';
      btn.setAttribute('aria-pressed', showingStill ? 'true' : 'false');
    }
    flows.forEach(function (fig) {
      fig.querySelector('[data-toggle]').addEventListener('click', function () {
        var still = fig.classList.contains('is-static');
        if (still) { fig.dataset.userPaused = '0'; fig.dataset.userPlayed = '1'; }
        else { fig.dataset.userPaused = '1'; }
        apply(fig);
      });
      apply(fig);
    });
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { e.target.dataset.offscreen = e.isIntersecting ? '0' : '1'; apply(e.target); });
      });
      flows.forEach(function (fig) { io.observe(fig); });
    }
    if (reduce.addEventListener) reduce.addEventListener('change', function () { flows.forEach(apply); });
  })();
</script>
